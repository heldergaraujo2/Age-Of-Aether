name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    name: Static repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f ROADMAP.md
          test -f ROADMAP_CONTENT_AND_CLIENT.md
          test -f PROJECT_MEMORY/00_CONTINUITY.md
          test -f Source/AgeOfAether/Public/Data/AetherContentTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherContentRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherAssetTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherAssetRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldActorTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldActorRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherSkillEffectTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherSkillEffectRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherLootRewardTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherLootRewardRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherQuestDialogueEventTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherQuestDialogueEventRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherRecipeTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherRecipeRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldContentTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldContentRegistry.h
          test -f Source/AgeOfAether/Private/Tests/AetherWorldContentRegistryTests.cpp
          test -f Source/AgeOfAether/Public/Client/AetherClientTypes.h
          test -f Source/AgeOfAether/Public/Client/AetherClientSubsystem.h
          test -f Source/AgeOfAether/Private/Tests/AetherClientSubsystemTests.cpp
      - name: Validate text and source invariants
        shell: python
        run: |
          from pathlib import Path
          roots=[Path("Source"),Path("Docs"),Path("PROJECT_MEMORY"),Path("Config")]
          files=[p for root in roots if root.exists() for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".h",".hpp",".cpp",".md",".cs"}]
          if not files: raise SystemExit("No source/documentation files were found.")
          failures=[]
          pairs={"}":"{",")":"(","]":"["}
          opens=set(pairs.values())
          for path in files:
              text=path.read_text(encoding="utf-8")
              if "\\\\n" in text: failures.append(f"{path}: contains literal escaped newline sequence")
              stack=[]
              for index,char in enumerate(text):
                  if char in opens: stack.append(char)
                  elif char in pairs:
                      if not stack or stack.pop()!=pairs[char]:
                          failures.append(f"{path}: unexpected '{char}' near character {index}"); break
              if stack: failures.append(f"{path}: unbalanced delimiters")
          if failures:
              print("\\n".join(failures)); raise SystemExit(1)
          print(f"Validated {len(files)} source/documentation files.")
      - name: Validate Phase 22 through Phase 34 deliverables
        shell: python
        run: |
          from pathlib import Path
          required_files = [
              "Source/AgeOfAether/Private/Tests/AetherWorldActorRegistryTests.cpp",
              "Docs/PHASE_22_MONSTER_NPC_BOSS_AI.md",
              "Source/AgeOfAether/Private/Tests/AetherSkillEffectRegistryTests.cpp",
              "Docs/PHASE_23_SKILLS_EFFECTS_STATUS.md",
              "Source/AgeOfAether/Private/Tests/AetherLootRewardRegistryTests.cpp",
              "Docs/PHASE_24_LOOT_DROP_REWARD_RESPAWN.md",
              "Source/AgeOfAether/Private/Tests/AetherQuestDialogueEventRegistryTests.cpp",
              "Docs/PHASE_25_QUEST_EVENT_DIALOGUE_WORLD_CONTENT.md",
              "Source/AgeOfAether/Private/Tests/AetherRecipeRegistryTests.cpp",
              "Docs/PHASE_26_CRAFTING_MIXING_FORGE_RECIPE_AUTHORING.md",
              "Docs/PHASE_27_WORLD_MAP_INTERACTION_STREAMING.md",
              "Source/AgeOfAether/Private/Tests/AetherWorldContentRegistryTests.cpp",
              "Docs/PHASE_28_CLIENT_CORE_ARCHITECTURE.md",
              "Source/AgeOfAether/Private/Tests/AetherUISubsystemTests.cpp",
              "Docs/PHASE_29_COMPLETE_MMO_UI_UX.md",
              "Source/AgeOfAether/Private/Tests/AetherPresentationSubsystemTests.cpp",
              "Docs/PHASE_30_CLIENT_PRESENTATION_PERFORMANCE_FINAL_INTEGRATION.md",
              "Source/AgeOfAether/Private/Tests/AetherClassRegistryTests.cpp",
              "Docs/PHASE_31_UNIVERSAL_PLAYER_CLASS_EVOLUTION.md",
              "Source/AgeOfAether/Private/Tests/AetherClassCatalogTests.cpp",
              "Docs/PHASE_32_FIVE_BASE_CLASSES_25_EVOLUTIONS.md",
              "Source/AgeOfAether/Private/Tests/AetherClassBalanceTests.cpp",
              "Config/Balance/ClassBalanceProfiles.aetherbalance",
              "Docs/PHASE_33_CONFIGURABLE_PVE_PVP_BALANCE.md",
              "Source/AgeOfAether/Public/Combat/AetherClassCombatIntegration.h",
              "Source/AgeOfAether/Private/Combat/AetherClassCombatIntegration.cpp",
              "Source/AgeOfAether/Private/Tests/AetherClassCombatIntegrationTests.cpp",
              "Source/AgeOfAether/Private/Tests/AetherCombatTests.cpp",
              "Docs/PHASE_34_CLASS_COMBAT_INTEGRATION_SERVER_AUTHORITY.md",
          ]
          for path in required_files:
              assert Path(path).is_file(), f"missing file: {path}"

          text = lambda p: Path(p).read_text(encoding="utf-8")
          checks = [
              ("Source/AgeOfAether/Public/Data/AetherWorldActorRegistry.h", "FAetherWorldActorRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherWorldActorRegistryTests.cpp", "FAetherWorldActorBasicTest"),
              ("Source/AgeOfAether/Public/Data/AetherSkillEffectRegistry.h", "FAetherSkillEffectRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherSkillEffectRegistryTests.cpp", "FAetherSkillEffectBasicTest"),
              ("Source/AgeOfAether/Public/Data/AetherLootRewardRegistry.h", "FAetherLootRewardRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherLootRewardRegistryTests.cpp", "FAetherLootRewardBasicTest"),
              ("Source/AgeOfAether/Public/Data/AetherQuestDialogueEventRegistry.h", "FAetherQuestDialogueEventRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherQuestDialogueEventRegistryTests.cpp", "FAetherQuestDialogueEventBasicTest"),
              ("Source/AgeOfAether/Public/Data/AetherRecipeRegistry.h", "FAetherRecipeRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherRecipeRegistryTests.cpp", "FAetherRecipeBasicTest"),
              ("Source/AgeOfAether/Public/Data/AetherWorldContentRegistry.h", "FAetherWorldContentRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherWorldContentRegistryTests.cpp", "FAetherWorldContentBasicTest"),
              ("Source/AgeOfAether/Public/Client/AetherClientSubsystem.h", "UAetherClientSubsystem"),
              ("Source/AgeOfAether/Private/Tests/AetherClientSubsystemTests.cpp", "FAetherClientRequestLifecycleTest"),
              ("Source/AgeOfAether/Public/UI/AetherUISubsystem.h", "UAetherUISubsystem"),
              ("Source/AgeOfAether/Private/Tests/AetherUISubsystemTests.cpp", "FAetherUINavigationTest"),
              ("Source/AgeOfAether/Public/Client/AetherPresentationSubsystem.h", "UAetherPresentationSubsystem"),
              ("Source/AgeOfAether/Private/Tests/AetherPresentationSubsystemTests.cpp", "FAetherPresentationAcceptanceTest"),
              ("Source/AgeOfAether/Public/Data/AetherClassRegistry.h", "FAetherClassRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherClassRegistryTests.cpp", "FAetherClassBasicTest"),
              ("Source/AgeOfAether/Public/Data/AetherClassCatalog.h", "FAetherClassCatalog"),
              ("Source/AgeOfAether/Private/Tests/AetherClassCatalogTests.cpp", "FAetherClassCatalogCountTest"),
              ("Source/AgeOfAether/Public/Data/AetherClassBalanceRegistry.h", "FAetherClassBalanceRegistry"),
              ("Source/AgeOfAether/Private/Tests/AetherClassBalanceTests.cpp", "FAetherClassBalanceParseTest"),
              ("Source/AgeOfAether/Public/Combat/AetherClassCombatIntegration.h", "FAetherClassCombatIntegration"),
              ("Source/AgeOfAether/Private/Tests/AetherClassCombatIntegrationTests.cpp", "FAetherClassCombatAuthoritativeResolutionTest"),
              ("Source/AgeOfAether/Private/Tests/AetherCombatTests.cpp", "FAetherCombatAuthoritativeClassBalanceTest"),
          ]
          for path, needle in checks:
              assert needle in text(path), f"{path}: missing {needle}"

          balance = [x for x in text("Config/Balance/ClassBalanceProfiles.aetherbalance").splitlines() if x.startswith("balance|")]
          assert len(balance) == 90
          assert all(len(x.split("|")) == 45 for x in balance)
          assert {x.split("|")[1] for x in balance} == {"development", "testing", "production"}
          for profile in {"development", "testing", "production"}:
              rows = [x.split("|") for x in balance if x.split("|")[1] == profile]
              assert len(rows) == 30
              assert len({x[2] for x in rows}) == 30

          assert "STATUS" in text("Docs/PHASE_34_CLASS_COMBAT_INTEGRATION_SERVER_AUTHORITY.md")
          assert "IMPLEMENTADO" in text("Docs/PHASE_34_CLASS_COMBAT_INTEGRATION_SERVER_AUTHORITY.md")
          assert "PRÓXIMO PASSO" in text("Docs/PHASE_34_CLASS_COMBAT_INTEGRATION_SERVER_AUTHORITY.md")

          assert "Phase 31" in text("ROADMAP.md")
          assert "Phase 32" in text("ROADMAP.md")
          assert "Phase 33" in text("ROADMAP.md")
          assert "Phase 34" in text("ROADMAP.md")
          assert "Phase 34" in text("PROJECT_MEMORY/00_CONTINUITY.md")
          print("Phase 22-34 repository contract and balance-config audit passed.")
      - name: Report
        run: echo "Repository static validation completed successfully."
