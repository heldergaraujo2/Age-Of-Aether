name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    name: Static repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f ROADMAP.md
          test -f ROADMAP_CONTENT_AND_CLIENT.md
          test -f PROJECT_MEMORY/00_CONTINUITY.md
          test -f Source/AgeOfAether/Public/Data/AetherContentTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherContentRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherAssetTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherAssetRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldActorTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldActorRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherSkillEffectTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherSkillEffectRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherLootRewardTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherLootRewardRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherQuestDialogueEventTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherQuestDialogueEventRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherRecipeTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherRecipeRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldContentTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldContentRegistry.h
          test -f Source/AgeOfAether/Private/Tests/AetherWorldContentRegistryTests.cpp
      - name: Validate text and source invariants
        shell: python
        run: |
          from pathlib import Path
          roots=[Path("Source"),Path("Docs"),Path("PROJECT_MEMORY")]
          files=[p for root in roots if root.exists() for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".h",".hpp",".cpp",".md",".cs"}]
          if not files: raise SystemExit("No source/documentation files were found.")
          failures=[]
          pairs={"}":"{",")":"(","]":"["}
          opens=set(pairs.values())
          for path in files:
              text=path.read_text(encoding="utf-8")
              if "\\\\n" in text: failures.append(f"{path}: contains literal escaped newline sequence")
              stack=[]
              for index,char in enumerate(text):
                  if char in opens: stack.append(char)
                  elif char in pairs:
                      if not stack or stack.pop()!=pairs[char]:
                          failures.append(f"{path}: unexpected '{char}' near character {index}"); break
              if stack: failures.append(f"{path}: unbalanced delimiters")
          if failures:
              print("\\n".join(failures)); raise SystemExit(1)
          print(f"Validated {len(files)} source/documentation files.")
      - name: Validate Phase 22 through Phase 27 deliverables
        shell: bash
        run: |
          set -euo pipefail
          test -f Source/AgeOfAether/Private/Tests/AetherWorldActorRegistryTests.cpp
          test -f Docs/PHASE_22_MONSTER_NPC_BOSS_AI.md
          test -f Source/AgeOfAether/Private/Tests/AetherSkillEffectRegistryTests.cpp
          test -f Docs/PHASE_23_SKILLS_EFFECTS_STATUS.md
          grep -q "FAetherWorldActorRegistry" Source/AgeOfAether/Public/Data/AetherWorldActorRegistry.h
          grep -q "FAetherWorldActorBasicTest" Source/AgeOfAether/Private/Tests/AetherWorldActorRegistryTests.cpp
          grep -q "FAetherSkillEffectRegistry" Source/AgeOfAether/Public/Data/AetherSkillEffectRegistry.h
          grep -q "FAetherSkillEffectBasicTest" Source/AgeOfAether/Private/Tests/AetherSkillEffectRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_22_MONSTER_NPC_BOSS_AI.md
          grep -q "Repository implementation" Docs/PHASE_23_SKILLS_EFFECTS_STATUS.md
          test -f Source/AgeOfAether/Private/Tests/AetherLootRewardRegistryTests.cpp
          test -f Docs/PHASE_24_LOOT_DROP_REWARD_RESPAWN.md
          grep -q "FAetherLootRewardRegistry" Source/AgeOfAether/Public/Data/AetherLootRewardRegistry.h
          grep -q "FAetherLootRewardBasicTest" Source/AgeOfAether/Private/Tests/AetherLootRewardRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_24_LOOT_DROP_REWARD_RESPAWN.md
          test -f Source/AgeOfAether/Private/Tests/AetherQuestDialogueEventRegistryTests.cpp
          test -f Docs/PHASE_25_QUEST_EVENT_DIALOGUE_WORLD_CONTENT.md
          grep -q "FAetherQuestDialogueEventRegistry" Source/AgeOfAether/Public/Data/AetherQuestDialogueEventRegistry.h
          grep -q "FAetherQuestDialogueEventBasicTest" Source/AgeOfAether/Private/Tests/AetherQuestDialogueEventRegistryTests.cpp
          test -f Source/AgeOfAether/Private/Tests/AetherRecipeRegistryTests.cpp
          test -f Docs/PHASE_26_CRAFTING_MIXING_FORGE_RECIPE_AUTHORING.md
          grep -q "FAetherRecipeRegistry" Source/AgeOfAether/Public/Data/AetherRecipeRegistry.h
          grep -q "FAetherRecipeBasicTest" Source/AgeOfAether/Private/Tests/AetherRecipeRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_26_CRAFTING_MIXING_FORGE_RECIPE_AUTHORING.md
          test -f Docs/PHASE_27_WORLD_MAP_INTERACTION_STREAMING.md
          grep -q "FAetherWorldContentRegistry" Source/AgeOfAether/Public/Data/AetherWorldContentRegistry.h
          grep -q "FAetherWorldContentBasicTest" Source/AgeOfAether/Private/Tests/AetherWorldContentRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_27_WORLD_MAP_INTERACTION_STREAMING.md
          grep -q "Repository implementation" Docs/PHASE_25_QUEST_EVENT_DIALOGUE_WORLD_CONTENT.md
      - name: Report
        run: echo "Repository static validation completed successfully."