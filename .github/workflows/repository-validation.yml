name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    name: Static repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f ROADMAP.md
          test -f ROADMAP_CONTENT_AND_CLIENT.md
          test -f PROJECT_MEMORY/00_CONTINUITY.md
          test -f Source/AgeOfAether/Public/Data/AetherContentTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherContentRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherAssetTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherAssetRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldActorTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldActorRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherSkillEffectTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherSkillEffectRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherLootRewardTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherLootRewardRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherQuestDialogueEventTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherQuestDialogueEventRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherRecipeTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherRecipeRegistry.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldContentTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherWorldContentRegistry.h
          test -f Source/AgeOfAether/Private/Tests/AetherWorldContentRegistryTests.cpp
          test -f Source/AgeOfAether/Public/Client/AetherClientTypes.h
          test -f Source/AgeOfAether/Public/Client/AetherClientSubsystem.h
          test -f Source/AgeOfAether/Private/Tests/AetherClientSubsystemTests.cpp
      - name: Validate text and source invariants
        shell: python
        run: |
          from pathlib import Path
          roots=[Path("Source"),Path("Docs"),Path("PROJECT_MEMORY"),Path("Config")]
          files=[p for root in roots if root.exists() for p in root.rglob("*") if p.is_file() and p.suffix.lower() in {".h",".hpp",".cpp",".md",".cs"}]
          if not files: raise SystemExit("No source/documentation files were found.")
          failures=[]
          pairs={"}":"{",")":"(","]":"["}
          opens=set(pairs.values())
          for path in files:
              text=path.read_text(encoding="utf-8")
              if "\\\\n" in text: failures.append(f"{path}: contains literal escaped newline sequence")
              stack=[]
              for index,char in enumerate(text):
                  if char in opens: stack.append(char)
                  elif char in pairs:
                      if not stack or stack.pop()!=pairs[char]:
                          failures.append(f"{path}: unexpected '{char}' near character {index}"); break
              if stack: failures.append(f"{path}: unbalanced delimiters")
          if failures:
              print("\\n".join(failures)); raise SystemExit(1)
          print(f"Validated {len(files)} source/documentation files.")
      - name: Validate Phase 22 through Phase 33 deliverables
        shell: bash
        run: |
          set -euo pipefail
          test -f Source/AgeOfAether/Private/Tests/AetherWorldActorRegistryTests.cpp
          test -f Docs/PHASE_22_MONSTER_NPC_BOSS_AI.md
          test -f Source/AgeOfAether/Private/Tests/AetherSkillEffectRegistryTests.cpp
          test -f Docs/PHASE_23_SKILLS_EFFECTS_STATUS.md
          grep -q "FAetherWorldActorRegistry" Source/AgeOfAether/Public/Data/AetherWorldActorRegistry.h
          grep -q "FAetherWorldActorBasicTest" Source/AgeOfAether/Private/Tests/AetherWorldActorRegistryTests.cpp
          grep -q "FAetherSkillEffectRegistry" Source/AgeOfAether/Public/Data/AetherSkillEffectRegistry.h
          grep -q "FAetherSkillEffectBasicTest" Source/AgeOfAether/Private/Tests/AetherSkillEffectRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_22_MONSTER_NPC_BOSS_AI.md
          grep -q "Repository implementation" Docs/PHASE_23_SKILLS_EFFECTS_STATUS.md
          test -f Source/AgeOfAether/Private/Tests/AetherLootRewardRegistryTests.cpp
          test -f Docs/PHASE_24_LOOT_DROP_REWARD_RESPAWN.md
          grep -q "FAetherLootRewardRegistry" Source/AgeOfAether/Public/Data/AetherLootRewardRegistry.h
          grep -q "FAetherLootRewardBasicTest" Source/AgeOfAether/Private/Tests/AetherLootRewardRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_24_LOOT_DROP_REWARD_RESPAWN.md
          test -f Source/AgeOfAether/Private/Tests/AetherQuestDialogueEventRegistryTests.cpp
          test -f Docs/PHASE_25_QUEST_EVENT_DIALOGUE_WORLD_CONTENT.md
          grep -q "FAetherQuestDialogueEventRegistry" Source/AgeOfAether/Public/Data/AetherQuestDialogueEventRegistry.h
          grep -q "FAetherQuestDialogueEventBasicTest" Source/AgeOfAether/Private/Tests/AetherQuestDialogueEventRegistryTests.cpp
          test -f Source/AgeOfAether/Private/Tests/AetherRecipeRegistryTests.cpp
          test -f Docs/PHASE_26_CRAFTING_MIXING_FORGE_RECIPE_AUTHORING.md
          grep -q "FAetherRecipeRegistry" Source/AgeOfAether/Public/Data/AetherRecipeRegistry.h
          grep -q "FAetherRecipeBasicTest" Source/AgeOfAether/Private/Tests/AetherRecipeRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_26_CRAFTING_MIXING_FORGE_RECIPE_AUTHORING.md
          test -f Docs/PHASE_27_WORLD_MAP_INTERACTION_STREAMING.md
          grep -q "FAetherWorldContentRegistry" Source/AgeOfAether/Public/Data/AetherWorldContentRegistry.h
          grep -q "FAetherWorldContentBasicTest" Source/AgeOfAether/Private/Tests/AetherWorldContentRegistryTests.cpp
          grep -q "Repository implementation" Docs/PHASE_27_WORLD_MAP_INTERACTION_STREAMING.md
          test -f Docs/PHASE_28_CLIENT_CORE_ARCHITECTURE.md
          grep -q "UAetherClientSubsystem" Source/AgeOfAether/Public/Client/AetherClientSubsystem.h
          grep -q "FAetherClientRequestLifecycleTest" Source/AgeOfAether/Private/Tests/AetherClientSubsystemTests.cpp
          grep -q "Repository implementation" Docs/PHASE_28_CLIENT_CORE_ARCHITECTURE.md
          test -f Source/AgeOfAether/Public/UI/AetherUITypes.h
          test -f Source/AgeOfAether/Public/UI/AetherUISubsystem.h
          test -f Source/AgeOfAether/Public/Client/AetherPresentationTypes.h
          test -f Source/AgeOfAether/Public/Client/AetherPresentationSubsystem.h
          test -f Source/AgeOfAether/Private/Tests/AetherPresentationSubsystemTests.cpp
          test -f Docs/PHASE_30_CLIENT_PRESENTATION_PERFORMANCE_FINAL_INTEGRATION.md
          grep -q "UAetherPresentationSubsystem" Source/AgeOfAether/Public/Client/AetherPresentationSubsystem.h
          grep -q "FAetherPresentationAcceptanceTest" Source/AgeOfAether/Private/Tests/AetherPresentationSubsystemTests.cpp
          grep -q "Repository implementation complete" Docs/PHASE_30_CLIENT_PRESENTATION_PERFORMANCE_FINAL_INTEGRATION.md
          test -f Source/AgeOfAether/Private/Tests/AetherUISubsystemTests.cpp
          test -f Docs/PHASE_29_COMPLETE_MMO_UI_UX.md
          grep -q "UAetherUISubsystem" Source/AgeOfAether/Public/UI/AetherUISubsystem.h
          grep -q "FAetherUINavigationTest" Source/AgeOfAether/Private/Tests/AetherUISubsystemTests.cpp
          grep -q "Repository implementation" Docs/PHASE_29_COMPLETE_MMO_UI_UX.md
          grep -q "Phase 29" ROADMAP.md
          grep -q "Phase 29" PROJECT_MEMORY/00_CONTINUITY.md
          grep -q "Repository implementation" Docs/PHASE_25_QUEST_EVENT_DIALOGUE_WORLD_CONTENT.md
          test -f Source/AgeOfAether/Public/Data/AetherClassTypes.h
          test -f Source/AgeOfAether/Public/Data/AetherClassRegistry.h
          test -f Source/AgeOfAether/Private/Data/AetherClassTypes.cpp
          test -f Source/AgeOfAether/Private/Data/AetherClassRegistry.cpp
          test -f Source/AgeOfAether/Private/Tests/AetherClassRegistryTests.cpp
          test -f Docs/PHASE_31_UNIVERSAL_PLAYER_CLASS_EVOLUTION.md
          grep -q "FAetherClassRegistry" Source/AgeOfAether/Public/Data/AetherClassRegistry.h
          grep -q "FAetherClassBasicTest" Source/AgeOfAether/Private/Tests/AetherClassRegistryTests.cpp
          grep -q "Repository implementation complete" Docs/PHASE_31_UNIVERSAL_PLAYER_CLASS_EVOLUTION.md
          grep -q "Phase 31" ROADMAP.md
          grep -q "Phase 31" PROJECT_MEMORY/00_CONTINUITY.md
          test -f Source/AgeOfAether/Public/Data/AetherClassCatalog.h
          test -f Source/AgeOfAether/Private/Data/AetherClassCatalog.cpp
          test -f Source/AgeOfAether/Private/Tests/AetherClassCatalogTests.cpp
          test -f Docs/PHASE_32_FIVE_BASE_CLASSES_25_EVOLUTIONS.md
          grep -q "FAetherClassCatalog" Source/AgeOfAether/Public/Data/AetherClassCatalog.h
          grep -q "FAetherClassCatalogCountTest" Source/AgeOfAether/Private/Tests/AetherClassCatalogTests.cpp
          grep -q "Repository/source level" Docs/PHASE_32_FIVE_BASE_CLASSES_25_EVOLUTIONS.md
          grep -q "Phase 32" ROADMAP.md
          grep -q "Phase 32" PROJECT_MEMORY/00_CONTINUITY.md
          test -f Source/AgeOfAether/Public/Data/AetherClassBalanceTypes.h
          test -f Source/AgeOfAether/Private/Data/AetherClassBalanceTypes.cpp
          test -f Source/AgeOfAether/Public/Data/AetherClassBalanceRegistry.h
          test -f Source/AgeOfAether/Private/Data/AetherClassBalanceRegistry.cpp
          test -f Source/AgeOfAether/Public/Data/AetherClassBalanceConfig.h
          test -f Source/AgeOfAether/Private/Data/AetherClassBalanceConfig.cpp
          test -f Source/AgeOfAether/Private/Tests/AetherClassBalanceTests.cpp
          test -f Config/Balance/ClassBalanceProfiles.aetherbalance
          test -f Docs/PHASE_33_CONFIGURABLE_PVE_PVP_BALANCE.md
          grep -q "FAetherClassBalanceRegistry" Source/AgeOfAether/Public/Data/AetherClassBalanceRegistry.h
          grep -q "FAetherClassBalanceParseTest" Source/AgeOfAether/Private/Tests/AetherClassBalanceTests.cpp
          grep -q "Phase 33" ROADMAP.md
          grep -q "Phase 33" PROJECT_MEMORY/00_CONTINUITY.md
          python - <<'PY'
          from pathlib import Path
          p=Path("Config/Balance/ClassBalanceProfiles.aetherbalance")
          lines=[x for x in p.read_text(encoding="utf-8").splitlines() if x.startswith("balance|")]
          assert len(lines)==90, len(lines)
          assert all(len(x.split("|"))==45 for x in lines)
          assert {x.split("|")[1] for x in lines}=={"development","testing","production"}
          for profile in {"development","testing","production"}:
              rows=[x.split("|") for x in lines if x.split("|")[1]==profile]
              assert len(rows)==30, profile
              assert len({x[2] for x in rows})==30
          print("Phase 33 external balance config audit passed.")
          PY
      - name: Report
        run: echo "Repository static validation completed successfully."
